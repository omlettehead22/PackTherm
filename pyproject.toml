[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "packtherm"
version = "0.6.14"
description = "Battery thermal management design toolkit for cylindrical-cell EV packs: electro-thermal cells, packed-module model, cooling design advisor"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0", "ht>=1.0", "fluids>=1.0"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
search = ["pymoo>=0.6.1"]  # v0.6.14: design search (packtherm.search)
dev = ["pytest>=7", "ruff>=0.4", "fastapi>=0.110", "uvicorn>=0.29", "httpx2>=2.0", "pymoo>=0.6.1"]

[project.urls]
Repository = "https://github.com/omlettehead22/packtherm"
Changelog = "https://github.com/omlettehead22/packtherm/blob/main/CHANGELOG.md"

[project.scripts]
packtherm = "packtherm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["src/packtherm/_vendor"]  # copied as is (BLAST-Lite, v0.6.13)

[tool.setuptools.package-data]
packtherm = ["data/*.csv", "data/*.yaml", "web_static/*", "web_static/assets/*", "_vendor/blast/LICENSE", "_vendor/blast/NOTICE"]
