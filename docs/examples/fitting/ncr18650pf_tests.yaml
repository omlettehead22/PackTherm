  - {file: "../../../validation/data/panasonic_18650pf/0C_UDDS.csv.gz", start_soc: 0.999, ambient_C: 0}
  - {file: "../../../validation/data/panasonic_18650pf/m10C_HWFET.csv.gz", start_soc: 0.9988, ambient_C: -10}
  - {file: "../../../validation/data/panasonic_18650pf/m10C_LA92.csv.gz", start_soc: 0.9985, ambient_C: -10}
  - {file: "../../../validation/data/panasonic_18650pf/m10C_UDDS.csv.gz", start_soc: 0.9983, ambient_C: -10}
