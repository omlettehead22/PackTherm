# The LG INR18650-HG2 fitted at six temperatures, from the tests in this repository (v0.6.4, the method
# of v0.6.3 unchanged: a blind check of it).
# Run from the repository's root:  packtherm fit docs/examples/fitting/lg_hg2_tests.yaml
# Data: P. Kollmeyer, M. Naguib and M. Skells, LG 18650HG2 Li-ion Battery Data, Mendeley Data v2 (2020),
# doi:10.17632/b5mj79w5w9.2, CC BY 4.0. Fitted on each temperature's pulse test (its pulses, and the
# discharge steps between them), first 1C discharge and Mixed1 drive cycle, and the 25 degC C/20 discharge;
# every other test is a check, never fitted to. The rig is calibrated on the 25 degC 1C discharge #1 and
# Mixed1 (both fitted to), with the heat from their measured voltage. Each test's ambient and start are in
# validation/data/lg_hg2/manifest.json; six aborted or empty runs are left out (excluded.json there).
packtherm_fit: 1
name: LG INR18650-HG2 (fitted)
like: HG2-LUMPED
rated_capacity_Ah: 3.0
dataset:
  citation: P. Kollmeyer, M. Naguib and M. Skells, LG 18650HG2 Li-ion Battery Data, Mendeley Data v2 (2020), doi:10.17632/b5mj79w5w9.2
  licence: CC BY 4.0
slow: "../../../tests/data/lg_hg2/10-26-18_09.29 549_C20DisCh_25degC_LGHG2.mat"
temperatures:
  - at: 25
    pulses: "../../../tests/data/lg_hg2/10-25-18_07.39 549_HPPC_25degC_LGHG2.mat"
    steps: "../../../tests/data/lg_hg2/10-25-18_07.39 549_HPPC_25degC_LGHG2.mat"
