# The Samsung INR21700 30T fitted at six temperatures, from the tests in this repository.
# Run from the repository's root:  packtherm fit docs/examples/fitting/samsung_30t_tests.yaml
# Data: P. Kollmeyer and M. Skells, Samsung INR21700 30T 3Ah Li-ion Battery Data, Mendeley Data v2 (2023),
# doi:10.17632/9xyvy2njj3.2, CC BY 4.0. Fitted on each temperature's pulse test (its pulses, and the
# discharge steps between them), first 1C discharge and Mixed1 drive cycle, and the 25 degC C/20 discharge;
# every other test is a check, never fitted to. The rig is calibrated on the 25 degC 1C discharge #1 and
# Mixed1 (both fitted to), with the heat from their measured voltage. Each test's ambient is the cell
# temperature after the settled rest before it, and its start the charge the tester counted before logging
# began (validation/data/samsung_30t/manifest.json).
packtherm_fit: 1
name: Samsung INR21700 30T (fitted)
like: 30T-LUMPED
rated_capacity_Ah: 3.0
dataset:
  citation: P. Kollmeyer and M. Skells, Samsung INR21700 30T 3Ah Li-ion Battery Data, Mendeley Data v2 (2023), doi:10.17632/9xyvy2njj3.2
  licence: CC BY 4.0
slow: "../../../tests/data/samsung_30t/03-16-19_04.00 729_C20DisCh_25degC_IN21700_30T.mat"
temperatures:
  - at: 25
    pulses: "../../../tests/data/samsung_30t/03-14-19_17.34 729_HPPC_25degC_IN21700_30T.mat"
    steps: "../../../tests/data/samsung_30t/03-14-19_17.34 729_HPPC_25degC_IN21700_30T.mat"
    discharges: ["../../../validation/data/samsung_30t/25C_1C_discharge_1.csv.gz"]
    cycles: ["../../../validation/data/samsung_30t/25C_Mixed1.csv.gz"]
