    steps: "../../../tests/data/samsung_30t/06-14-19_17.40 847_HPPC_-10degC_IN21700_30T.mat"
    discharges: ["../../../validation/data/samsung_30t/m10C_1C_discharge_1.csv.gz"]
    cycles: ["../../../validation/data/samsung_30t/m10C_Mixed1.csv.gz"]
  - at: -20
    pulses: "../../../tests/data/samsung_30t/06-28-19_20.09 866_HPPC_-20degC_IN21700_30T.mat"
    steps: "../../../tests/data/samsung_30t/06-28-19_20.09 866_HPPC_-20degC_IN21700_30T.mat"
