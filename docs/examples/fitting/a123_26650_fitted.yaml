  7 degC (gamma, tau_m, tau_d); -3 degC (gamma, tau_d); -12 degC (gamma, Rd_25C, tau_d): those values sit at the
  edge of their ranges. The voltage and the 10 s DC resistance are fitted; take the branch values one by one with
  care (a pulse test pins them)'
