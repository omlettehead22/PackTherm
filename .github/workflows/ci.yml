name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  web:
    # The web app: type-check, test, and build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser-engine:
    # The public site: PackTherm under Pyodide in headless Chromium must give packtherm run's results.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the public site
        run: python web/scripts/build_pages.py --out web/dist-pages
      - name: Run studies in the browser
        run: node web/e2e/browser-engine.mjs web/dist-pages e2e-out
        working-directory: .
        env:
          NODE_PATH: web/node_modules
      - name: Same results as packtherm run
        run: python web/e2e/compare.py e2e-out/browser_results.json
      - name: Timings
        if: always()
        run: cat e2e-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-engine
          path: e2e-out

  docker:
    # Build the API image, start it, and run a small study through it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t packtherm .
      - run: docker run -d --name api -p 8000:8000 packtherm
      - name: Health and a study through the API
        run: |
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          id=$(curl -sf -X POST localhost:8000/studies -H 'content-type: application/json' \
            -d '{"packtherm_study":1,"cell":"M50","mode":"fast","duty":{"type":"constant","c_rate":1.5},"design_space":{"topologies":["ribbon"],"fillers":["none"],"coolant_flows_g_s":[0.05],"chiller_C":[]}}' \
            | python3 -c "import sys, json; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 60); do
            state=$(curl -sf localhost:8000/studies/$id | python3 -c "import sys, json; print(json.load(sys.stdin)['state'])")
            [ "$state" = done ] && break
            [ "$state" = failed ] && { curl -s localhost:8000/studies/$id; exit 1; }
            sleep 2
          done
          curl -sf localhost:8000/studies/$id/results | python3 -c "import sys, json; d = json.load(sys.stdin); print(d['summary']['text']); assert d['picks']"
      - name: The web app is served
        run: |
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          asset=$(curl -sf localhost:8000/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          curl -sf "localhost:8000$asset" > /dev/null
      - if: failure()
        run: docker logs api
